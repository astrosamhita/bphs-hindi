<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>बृहत्पाराशर सरल ज्ञान</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Mukta', sans-serif; } </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen pb-16">

  <header class="bg-amber-950 text-amber-50 shadow-md sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-wide flex items-center gap-1.5">
          <span>📖</span> बृहत्पाराशर सरल ज्ञान
        </h1>
        <p class="text-[11px] text-amber-200">सम्पूर्ण ४९ अध्याय : प्रामाणिक फलित सूत्र</p>
      </div>
      <div>
        <span id="badge-count" class="text-xs font-semibold bg-amber-900 border border-amber-700 px-2.5 py-1 rounded-full text-amber-100">...</span>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- Controls -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-200 space-y-3">
      <div>
        <label for="ch-select" class="block text-xs font-bold text-amber-950 mb-1">अध्याय चुनें:</label>
        <select 
          id="ch-select" 
          class="w-full px-3 py-2.5 bg-stone-50 border border-stone-300 rounded-xl text-sm font-semibold text-stone-800 focus:outline-none focus:ring-2 focus:ring-amber-800"
          onchange="fetchChapter(this.value)"
        >
          <!-- All 49 Chapters mapped to Dr. Suresh Chandra Mishra's index -->
          <option value="1" selected>अध्याय १ : सृष्टिकमक्थनाध्याय</option>
          <option value="2">अध्याय २ : अवतार कथनाध्याय</option>
          <option value="3">अध्याय ३ : ग्रहगुणस्वरूपध्याय</option>
          <option value="4">अध्याय ४ : राशिस्वरूपध्याय</option>
          <option value="5">अध्याय ५ : विशेष लग्नाध्याय</option>
          <option value="6">अध्याय ६ : वर्णददशाध्याय</option>
          <option value="7">अध्याय ७ : षोडशवर्गध्याय</option>
          <option value="8">अध्याय ८ : वर्गविवेचनाध्याय</option>
          <option value="9">अध्याय ९ : राशिदृष्टिभेदाध्याय</option>
          <option value="10">अध्याय १० : अरिष्टाध्याय</option>
          <option value="11">अध्याय ११ : अरिष्टभंगाध्याय</option>
          <option value="12">अध्याय १२ : भावविवेकध्यायाय</option>
          <option value="13">अध्याय १३ : लग्नभावफलाध्याय</option>
          <option value="14">अध्याय १४ : धनभावफलाध्याय</option>
          <option value="15">अध्याय १५ : तृतीयभावफलाध्याय</option>
          <option value="16">अध्याय १६ : सुखभावफलाध्याय</option>
          <option value="17">अध्याय १७ : पंचमभावफलाध्याय</option>
          <option value="18">अध्याय १८ : षष्ठभावफलाध्याय</option>
          <option value="19">अध्याय १९ : सप्तमभावफलाध्याय</option>
          <option value="20">अध्याय २० : आयुर्भावफलाध्याय</option>
          <option value="21">अध्याय २१ : भाग्यभावफलाध्याय</option>
          <option value="22">अध्याय २२ : दशमभावफलाध्याय</option>
          <option value="23">अध्याय २३ : लाभभावफलाध्याय</option>
          <option value="24">अध्याय २४ : व्ययभावफलाध्याय</option>
          <option value="25">अध्याय २५ : भावेशफलाध्याय</option>
          <option value="26">अध्याय २६ : अप्रकाशग्रहफलाध्याय</option>
          <option value="27">अध्याय २७ : पदाध्याय</option>
          <option value="28">अध्याय २८ : उपपदाध्याय</option>
          <option value="29">अध्याय २९ : अर्गलाफलाध्याय</option>
          <option value="30">अध्याय ३० : कारकाध्याय</option>
          <option value="31">अध्याय ३१ : कारकांशफलाध्याय</option>
          <option value="32">अध्याय ३२ : योगकारकाध्याय</option>
          <option value="33">अध्याय ३३ : नामसंयोगाध्याय</option>
          <option value="34">अध्याय ३४ : विविध योगाध्याय</option>
          <option value="35">अध्याय ३५ : रविवन्द्रयोगाध्याय</option>
          <option value="36">अध्याय ३६ : राजयोगाध्याय</option>
          <option value="37">अध्याय ३७ : धनयोगाध्याय</option>
          <option value="38">अध्याय ३८ : दरिद्रयोगाध्याय</option>
          <option value="39">अध्याय ३९ : आयुर्दायध्याय</option>
          <option value="40">अध्याय ४० : मारकमेदाध्याय</option>
          <option value="41">अध्याय ४१ : वृत्ति (व्यवसाय) अध्याय</option>
          <option value="42">अध्याय ४२ : ग्रहावस्थाध्याय</option>
          <option value="43">अध्याय ४३ : ग्रहाबलवध्यायाय</option>
          <option value="44">अध्याय ४४ : इष्टकष्टाध्याय</option>
          <option value="45">अध्याय ४५ : दशाध्याय</option>
          <option value="46">अध्याय ४६ : कालचक्रदशाध्याय</option>
          <option value="47">अध्याय ४७ : विभिन्नदशाध्याय</option>
          <option value="48">अध्याय ४८ : अन्तर्दशाध्याय</option>
          <option value="49">अध्याय ४९ : दशाफलाध्याय</option>
        </select>
      </div>

      <input 
        type="text" 
        id="search-input" 
        placeholder="श्लोक, ग्रह या फलित नियम खोजें..." 
        class="w-full px-3.5 py-2 bg-stone-50 border border-stone-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-800"
        oninput="handleSearch()"
      >

      <div class="flex items-center justify-between text-xs text-stone-500 pt-1">
        <span id="label-chapter" class="font-bold text-amber-950"></span>
        <span id="label-filtered" class="font-semibold text-amber-900"></span>
      </div>
    </div>

    <!-- Cards Container -->
    <div id="cards-container" class="space-y-4"></div>

  </main>

  <script>
    let activeList = [];

    async function fetchChapter(num) {
      const container = document.getElementById('cards-container');
      const select = document.getElementById('ch-select');
      document.getElementById('label-chapter').textContent = select.options[select.selectedIndex].text;
      document.getElementById('badge-count').textContent = 'लोड हो रहा है...';

      container.innerHTML = `
        <div class="bg-white p-8 rounded-2xl text-center border border-stone-200">
          <p class="text-sm font-semibold text-stone-600">📜 सामग्री लोड हो रही है...</p>
        </div>`;

      try {
        const res = await fetch(`data/ch${num}.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('अध्याय फाइल नहीं मिली');
        activeList = await res.json();
        document.getElementById('search-input').value = '';
        renderCards(activeList);
      } catch (err) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center border border-amber-200 space-y-2">
            <span class="text-3xl block">✍️</span>
            <p class="font-bold text-stone-800 text-sm">यह अध्याय शीघ्र उपलब्ध होगा</p>
            <p class="text-xs text-stone-500">इस अध्याय का डेटा (data/ch${num}.json) अभी जोड़ा जाना शेष है।</p>
          </div>`;
        document.getElementById('badge-count').textContent = 'प्रतीक्षारत';
        document.getElementById('label-filtered').textContent = '';
      }
    }

    function renderCards(items) {
      const container = document.getElementById('cards-container');
      document.getElementById('badge-count').textContent = 'कुल श्लोक: ' + activeList.length;
      document.getElementById('label-filtered').textContent = 'दिख रहे हैं: ' + items.length;

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center text-stone-500 border border-stone-200">
            <p class="text-sm font-medium">कोई श्लोक नहीं मिला।</p>
          </div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <article class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden hover:border-amber-400 transition-colors">
          <div class="bg-stone-100 px-4 py-2.5 flex items-center justify-between border-b border-stone-200">
            <span class="text-xs font-bold bg-amber-900 text-amber-50 px-2.5 py-0.5 rounded-md">
              ${item.shloka_num}
            </span>
            <span class="text-xs font-semibold text-stone-700">${item.topic}</span>
          </div>

          <div class="p-4 space-y-3.5">
            <div class="bg-amber-50 border-l-4 border-amber-800 p-3 rounded-r-xl">
              <p class="text-amber-950 font-bold text-base leading-relaxed whitespace-pre-line">${item.sanskrit}</p>
            </div>

            <details class="text-xs text-stone-600 group">
              <summary class="cursor-pointer font-bold text-amber-800 select-none hover:underline">
                📖 पदच्छेद एवं शब्दार्थ (विस्तार देखें)
              </summary>
              <div class="mt-2 p-2.5 bg-stone-50 rounded-lg border border-stone-200 text-stone-700 leading-relaxed">
                ${item.word_meaning}
              </div>
            </details>

            <div>
              <span class="text-[11px] font-bold text-amber-900 uppercase block mb-1">सरल हिन्दी व्याख्या:</span>
              <p class="text-sm text-stone-800 leading-relaxed">${item.saral_hindi}</p>
            </div>

            <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl flex items-start gap-2.5">
              <span class="text-emerald-700 text-base leading-none mt-0.5">💡</span>
              <div>
                <strong class="text-xs text-emerald-950 block mb-0.5">फलित ज्योतिष सूत्र:</strong>
                <p class="text-xs text-emerald-900 leading-relaxed">${item.phalit_sutra}</p>
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    function handleSearch() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      if (!q) {
        renderCards(activeList);
        return;
      }
      const filtered = activeList.filter(item => 
        item.shloka_num.toLowerCase().includes(q) ||
        item.topic.toLowerCase().includes(q) ||
        item.sanskrit.toLowerCase().includes(q) ||
        item.saral_hindi.toLowerCase().includes(q) ||
        item.phalit_sutra.toLowerCase().includes(q)
      );
      renderCards(filtered);
    }

    // Load initial chapter
    window.addEventListener('DOMContentLoaded', () => {
      fetchChapter(document.getElementById('ch-select').value);
    });
  </script>
</body>
</html>
