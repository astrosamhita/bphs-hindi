<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>बृहत्पाराशर सरल ज्ञान</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Mukta', sans-serif; } </style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-amber-950 text-amber-50 shadow-md sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-wide flex items-center gap-1.5">
          <span>📖</span> बृहत्पाराशर सरल ज्ञान
        </h1>
        <p class="text-[11px] text-amber-200">सम्पूर्ण फलित सूत्र एवं श्लोक विश्लेषण</p>
      </div>
      <div>
        <span id="badge-count" class="text-xs font-semibold bg-amber-900 border border-amber-700 px-2.5 py-1 rounded-full text-amber-100">प्रतीक्षा...</span>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- Filter Card -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-200 space-y-3">
      <div>
        <label for="ch-select" class="block text-xs font-bold text-amber-950 mb-1">अध्याय चुनें:</label>
        <select 
          id="ch-select" 
          class="w-full px-3 py-2.5 bg-stone-50 border border-stone-300 rounded-xl text-sm font-semibold text-stone-800 focus:outline-none focus:ring-2 focus:ring-amber-800"
        >
          <option value="1">अध्याय १ : सृष्टिक्रम वर्णन</option>
          <option value="2">अध्याय २ : सृष्टि-स्थिति एवं ग्रह-अवतार</option>
          <option value="3" selected>अध्याय ३ : ग्रह-स्वरूप एवं लक्षण</option>
        </select>
      </div>

      <div>
        <input 
          type="text" 
          id="search-input" 
          placeholder="श्लोक, ग्रह या फलित नियम खोजें..." 
          class="w-full px-3.5 py-2 bg-stone-50 border border-stone-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-800"
        >
      </div>

      <div class="flex items-center justify-between text-xs text-stone-500 pt-1">
        <span id="label-chapter" class="font-bold text-amber-950"></span>
        <span id="label-filtered" class="font-semibold text-stone-600"></span>
      </div>
    </div>

    <!-- Cards Container -->
    <div id="cards-container" class="space-y-4"></div>

  </main>

  <script>
    let rawItems = [];

    async function loadChapter(num) {
      const container = document.getElementById('cards-container');
      const select = document.getElementById('ch-select');
      const title = select.options[select.selectedIndex].text;
      
      document.getElementById('label-chapter').textContent = title;
      document.getElementById('badge-count').textContent = 'लोड हो रहा है...';
      document.getElementById('label-filtered').textContent = '';

      container.innerHTML = `
        <div class="bg-white p-8 rounded-2xl text-center border border-stone-200">
          <p class="text-sm font-semibold text-stone-600">📜 सामग्री लोड हो रही है...</p>
        </div>`;

      try {
        const fetchUrl = 'data/ch' + num + '.json?v=' + Date.now();
        const res = await fetch(fetchUrl);
        if (!res.ok) {
          throw new Error('HTTP ' + res.status + ' (फाइल नहीं मिली)');
        }
        rawItems = await res.json();
        document.getElementById('search-input').value = '';
        displayCards(rawItems);
      } catch (e) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl text-center border border-rose-300 space-y-2">
            <span class="text-3xl block">⚠️</span>
            <p class="font-bold text-rose-800 text-sm">लोडिंग त्रुटि</p>
            <p class="text-xs text-stone-600">कारण: <b>` + e.message + `</b></p>
            <p class="text-[11px] text-stone-400 font-mono">पाथ: data/ch` + num + `.json</p>
          </div>`;
        document.getElementById('badge-count').textContent = 'त्रुटि';
      }
    }

    function displayCards(items) {
      const container = document.getElementById('cards-container');
      document.getElementById('badge-count').textContent = 'कुल: ' + rawItems.length;
      document.getElementById('label-filtered').textContent = 'दिख रहे हैं: ' + items.length;

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center text-stone-500 border border-stone-200">
            <p class="text-sm font-medium">कोई श्लोक नहीं मिला।</p>
          </div>`;
        return;
      }

      let html = '';
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        html += `
          <article class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
            <div class="bg-stone-100 px-4 py-2.5 flex items-center justify-between border-b border-stone-200">
              <span class="text-xs font-bold bg-amber-900 text-amber-50 px-2.5 py-0.5 rounded-md">
                ${item.shloka_num || ''}
              </span>
              <span class="text-xs font-semibold text-stone-700">${item.topic || ''}</span>
            </div>

            <div class="p-4 space-y-3">
              <div class="bg-amber-50 border-l-4 border-amber-800 p-3 rounded-r-xl">
                <p class="text-amber-950 font-bold text-base leading-relaxed whitespace-pre-line">${item.sanskrit || ''}</p>
              </div>

              <details class="text-xs text-stone-600">
                <summary class="cursor-pointer font-bold text-amber-800 hover:underline select-none">
                  📖 पदच्छेद एवं शब्दार्थ (क्लिक करें)
                </summary>
                <div class="mt-2 p-2.5 bg-stone-50 rounded-lg border border-stone-200 text-stone-700 leading-relaxed">
                  ${item.word_meaning || ''}
                </div>
              </details>

              <div>
                <span class="text-[11px] font-bold text-amber-900 uppercase block mb-0.5">सरल हिन्दी:</span>
                <p class="text-sm text-stone-800 leading-relaxed">${item.saral_hindi || ''}</p>
              </div>

              <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl">
                <strong class="text-xs text-emerald-950 block mb-0.5">💡 फलित नियम:</strong>
                <p class="text-xs text-emerald-900 leading-relaxed">${item.phalit_sutra || ''}</p>
              </div>
            </div>
          </article>`;
      }
      container.innerHTML = html;
    }

    function doSearch() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      if (!q) {
        displayCards(rawItems);
        return;
      }
      const filtered = rawItems.filter(function(it) {
        return (it.shloka_num && it.shloka_num.toLowerCase().includes(q)) ||
               (it.topic && it.topic.toLowerCase().includes(q)) ||
               (it.sanskrit && it.sanskrit.toLowerCase().includes(q)) ||
               (it.saral_hindi && it.saral_hindi.toLowerCase().includes(q)) ||
               (it.phalit_sutra && it.phalit_sutra.toLowerCase().includes(q));
      });
      displayCards(filtered);
    }

    document.getElementById('ch-select').addEventListener('change', function(e) {
      loadChapter(e.target.value);
    });

    document.getElementById('search-input').addEventListener('input', doSearch);

    // Initial load
    loadChapter('3');
  </script>
</body>
</html>
