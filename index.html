<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>सरल बृहत्पाराशर - ज्योतिष अध्ययन</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mukta', sans-serif; }
    .heading-font { font-family: 'Yatra One', cursive, sans-serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen pb-12">

  <!-- Sticky Header -->
  <header class="bg-amber-950 text-amber-50 shadow-md sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
          <span>📖</span> बृहत्पाराशर सरल ज्ञान
        </h1>
        <p class="text-[11px] text-amber-200">विद्यार्थियों हेतु प्रामाणिक फलित सूत्र</p>
      </div>
      <div class="text-right">
        <span id="shloka-count" class="text-xs font-semibold bg-amber-900/80 border border-amber-700/60 px-2.5 py-1 rounded-full text-amber-100"></span>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- Search & Chapter Filter -->
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-stone-200 space-y-2">
      <input 
        type="text" 
        id="search" 
        placeholder="श्लोक संख्या, शब्द या फलित सूत्र खोजें..." 
        class="w-full px-3 py-2 bg-stone-50 border border-stone-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-800"
        oninput="filterContent()"
      >
      <div class="flex items-center justify-between text-xs text-stone-500 px-1 pt-1">
        <span>💡 अध्याय १: सृष्टिक्रम वर्णन</span>
        <span id="active-count" class="font-medium text-amber-900"></span>
      </div>
    </div>

    <!-- Cards Container -->
    <div id="cards-container" class="space-y-4"></div>

  </main>

        "phalit_sutra": "वासुदेव चेतना ही केंद्र है। कुंडली में लग्न और लग्नेश जातक के व्यक्त और अव्यक्त दोनों सामर्थ्य का निर्धारण करते हैं।"
      },
      {
        "id": 7,
        "chapter": "अध्याय १: सृष्टिक्रम",

        "word_meaning": "व्यक्तात्मकः = व्यक्त दशा में; त्रिभिः युक्तः = तीन शक्तियों से संयुक्त; कथ्यते = कहे जाते हैं; अनन्तशक्तिमान् = अनंत शक्ति से संपन्न; सत्त्वप्रधाना = सत्त्वगुण प्रधान; श्रीशक्तिः = लक्ष्मी शक्ति; भूशक्तिः च = और भू (पृथ्वी) शक्ति; रजोगुणा = रजोगुण से युक्त।",

        "phalit_sutra": "कुंडली में 'श्री' (धन, संपदा, शुभता) सत्त्वगुण से प्राप्त होती है, और 'भू' (स्थिर संपत्ति, भूमि, कर्म) रजोगुण के पराक्रम से सिद्ध होती है।"
      }

    function renderShlokas(items) {
      const countBadge = document.getElementById('shloka-count');
      const activeText = document.getElementById('active-count');
      if (countBadge) countBadge.textContent = `कुल पाठ: ${items.length}`;
      if (activeText) activeText.textContent = `दिख रहे हैं: ${items.length} / ${shlokasData.length}`;

      const container = document.getElementById('cards-container');
      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center text-stone-500 border border-stone-200">
            <span class="text-3xl block mb-2">🔍</span>
            <p class="font-medium text-sm">कोई श्लोक नहीं मिला।</p>
          </div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <article class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden hover:border-amber-400 transition-colors">
          
          <!-- Card Header -->
          <div class="bg-stone-100/70 px-4 py-2.5 flex items-center justify-between border-b border-stone-200">
            <span class="text-xs font-bold bg-amber-900 text-amber-100 px-2.5 py-0.5 rounded-md">
              ${item.shloka_num}
            </span>
            <span class="text-xs font-semibold text-stone-600">${item.topic}</span>
          </div>

          <div class="p-4 space-y-3.5">
            <!-- Sanskrit Verse -->
            <div class="bg-amber-50/70 border-l-4 border-amber-800 p-3 rounded-r-xl">
              <p class="text-amber-950 font-semibold text-base leading-relaxed whitespace-pre-line tracking-wide">
                ${item.sanskrit}
              </p>
            </div>

            <!-- Word-by-word Breakdown (Collapsible for students) -->
            <details class="text-xs text-stone-600 group">
              <summary class="cursor-pointer text-amber-800 font-semibold flex items-center gap-1 select-none hover:underline">
                <span>📖 पदच्छेद एवं शब्दार्थ (विस्तार देखें)</span>
              </summary>
              <div class="mt-2 p-2.5 bg-stone-50 rounded-lg border border-stone-200 leading-relaxed text-stone-700">
                ${item.word_meaning}
              </div>
            </details>

            <!-- Easy Hindi Explanation -->
            <div>
              <span class="text-[11px] font-bold text-amber-900 tracking-wider uppercase block mb-1">
                सरल हिन्दी व्याख्या:
              </span>
              <p class="text-sm text-stone-800 leading-relaxed">
                ${item.saral_hindi}
              </p>
            </div>

            <!-- Practical Astrology Rule -->
            <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl flex items-start gap-2.5">
              <span class="text-emerald-700 text-base leading-none mt-0.5">💡</span>
              <div>
                <strong class="text-xs text-emerald-950 block mb-0.5">फलित ज्योतिष सूत्र:</strong>
                <p class="text-xs text-emerald-900 leading-relaxed">${item.phalit_sutra}</p>
              </div>
            </div>
          </div>

        </article>
      `).join('');
    }

    function filterContent() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const filtered = shlokasData.filter(item => 
        item.shloka_num.toLowerCase().includes(q) ||
        item.topic.toLowerCase().includes(q) ||
        item.sanskrit.toLowerCase().includes(q) ||
        item.saral_hindi.toLowerCase().includes(q) ||
        item.phalit_sutra.toLowerCase().includes(q)
      );
      renderShlokas(filtered);
    }

    // Initialize
    renderShlokas(shlokasData);
